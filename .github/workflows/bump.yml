name: Bump userscript version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump:
    # Avoid reacting to a version-bump commit created by this workflow.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Increment patch version
        shell: bash
        run: |
          set -euo pipefail

          file="forwarder.user.js"
          version=$(sed -nE 's|^[[:space:]]*//[[:space:]]*@version[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*|\1|p' "$file" | head -n1)

          if [[ -z "$version" ]]; then
            echo "Could not find @version in $file" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$version"
          new_version="$major.$minor.$((patch + 1))"
          sed -i -E "0,/(@version[[:space:]]+)$version/s//\1$new_version/" "$file"
          echo "Bumped $file from $version to $new_version"

      - name: Commit and push version bump
        run: |
          git add forwarder.user.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          version=$(sed -nE 's|^[[:space:]]*//[[:space:]]*@version[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*|\1|p' forwarder.user.js | head -n1)
          git commit -m "ci: bump version to $version"
          git push
